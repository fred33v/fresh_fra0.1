name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On pull requests a new push cancels the run it replaces. On main every merge
# gets its own group (keyed by commit), so each one is tested to the end even
# when several merges land within seconds of each other. With a shared group,
# GitHub would cancel the earlier ones and a broken intermediate state would
# go unnoticed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Security regression tests
        run: pnpm run test:security

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web dashboard
        run: cd apps/fra-web-dashboard && npm run build

      - name: Build backend
        run: cd apps/fra-backend/backend && npm run build

      - name: Export budget guide (web)
        run: cd apps/fra-budget-guide && npx expo export --platform web

      - name: Export training app (web)
        run: cd apps/fra-training-app && npx expo export --platform web

  database:
    name: Database (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Unit tests use the in-memory stores; this runs the real SQL: every migration on a
    # fresh database (twice, to prove they re-run safely), then the API end to end.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fra
          POSTGRES_PASSWORD: fra-ci-only
          POSTGRES_DB: fra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fra:fra-ci-only@localhost:5432/fra
      NODE_ENV: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: apps/fra-backend/backend
        run: pnpm migrate

      - name: Re-run migrations (must be a no-op)
        working-directory: apps/fra-backend/backend
        run: pnpm migrate

      - name: Migration integration safety tests
        working-directory: apps/fra-backend/backend
        run: node scripts/migration-integration.mjs

      - name: Start backend
        working-directory: apps/fra-backend/backend
        run: |
          pnpm exec tsx src/index.ts > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health | grep -q '"database":"ok"' && exit 0
            sleep 1
          done
          cat backend.log
          exit 1

      - name: API smoke test against PostgreSQL
        working-directory: apps/fra-backend/backend
        env:
          # PDF rendering needs a headless browser, which is not under test here
          SMOKE_SKIP_PDF: '1'
        run: node scripts/db-smoke.mjs

      - name: Transaction concurrency and permissions (PostgreSQL)
        working-directory: apps/fra-backend/backend
        env:
          TRANSACTION_TEST_DATABASE: '1'
        run: node scripts/transaction-integration.mjs

      - name: Backend log on failure
        if: failure()
        working-directory: apps/fra-backend/backend
        run: cat backend.log || true

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init (no remote state)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
