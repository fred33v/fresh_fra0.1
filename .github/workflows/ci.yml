name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On pull requests a new push cancels the run it replaces. On main every merge
# gets its own group (keyed by commit), so each one is tested to the end even
# when several merges land within seconds of each other. With a shared group,
# GitHub would cancel the earlier ones and a broken intermediate state would
# go unnoticed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Security regression tests
        run: pnpm run test:security

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web dashboard
        run: cd apps/fra-web-dashboard && npm run build

      - name: Build backend
        run: cd apps/fra-backend/backend && npm run build

      - name: Export budget guide (web)
        run: cd apps/fra-budget-guide && npx expo export --platform web

      - name: Export training app (web)
        run: cd apps/fra-training-app && npx expo export --platform web

  database:
    name: Database (PostgreSQL)
    # Playwright 1.58 supports Ubuntu 24.04, while ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    # Unit tests use the in-memory stores; this runs the real SQL: every migration on a
    # fresh database (twice, to prove they re-run safely), then the API end to end.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fra
          POSTGRES_PASSWORD: fra-ci-only
          POSTGRES_DB: fra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEBHOOK_WORKER_ENABLED: 'false' # Integration drains use a fake transport; never call external endpoints
      DATABASE_URL: postgresql://fra:fra-ci-only@localhost:5432/fra
      NODE_ENV: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: apps/fra-backend/backend
        run: pnpm migrate

      - name: Re-run migrations (must be a no-op)
        working-directory: apps/fra-backend/backend
        run: pnpm migrate

      - name: Migration integration safety tests
        working-directory: apps/fra-backend/backend
        run: node scripts/migration-integration.mjs

      - name: Start backend
        working-directory: apps/fra-backend/backend
        run: |
          pnpm exec tsx src/index.ts > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health | grep -q '"database":"ok"' && exit 0
            sleep 1
          done
          cat backend.log
          exit 1

      - name: API smoke test against PostgreSQL
        working-directory: apps/fra-backend/backend
        env:
          # PDF rendering needs a headless browser, which is not under test here
          SMOKE_SKIP_PDF: '1'
        run: node scripts/db-smoke.mjs

      - name: Transaction concurrency and permissions (PostgreSQL)
        working-directory: apps/fra-backend/backend
        env:
          TRANSACTION_TEST_DATABASE: '1'
        run: node scripts/transaction-integration.mjs

      - name: Payment lifecycle and durable receipts (PostgreSQL)
        working-directory: apps/fra-backend/backend
        env:
          PAYMENT_TEST_DATABASE: '1'
        run: node --import tsx scripts/payment-integration.mjs

      - name: Durable outgoing webhooks (PostgreSQL, fake transport)
        working-directory: apps/fra-backend/backend
        env:
          WEBHOOK_TEST_DATABASE: '1'
        run: node --import tsx scripts/webhook-delivery-integration.mjs

      - name: Atomic domain publication and budget planning (PostgreSQL)
        working-directory: apps/fra-backend/backend
        env:
          DOMAIN_BUDGET_TEST_DATABASE: '1'
        run: node --import tsx scripts/domain-budget-integration.mjs

      - name: Provider recruitment (PostgreSQL, local evidence fixtures)
        working-directory: apps/fra-backend/backend
        env:
          PROVIDER_TEST_DATABASE: '1'
        run: |
          node --import tsx scripts/provider-recruitment-integration.mjs
          node --import tsx scripts/provider-candidate-port-integration.mjs

      - name: Professional scope and certificate authority (isolated PostgreSQL)
        working-directory: apps/fra-backend/backend
        env:
          PROFESSIONAL_TEST_DATABASE: '1'
        run: |
          node --input-type=module -e 'import pg from "pg"; const db=new pg.Pool({connectionString:process.env.DATABASE_URL}); try {await db.query("CREATE DATABASE professional_scope_test");} finally {await db.end();}'
          export DATABASE_URL=postgresql://fra:fra-ci-only@localhost:5432/professional_scope_test
          export DATABASE_URL_UNPOOLED="$DATABASE_URL"
          npm run migrate
          node --import tsx scripts/professional-scope-integration.mjs
          IDENTIFIER_TEST_DATABASE=1 node --import tsx scripts/identifier-integration.mjs
          IDENTIFIER_TEST_DATABASE=1 node --import tsx scripts/identifier-backfill-integration.mjs
          SALES_REPORT_TEST_DATABASE=1 node --import tsx scripts/sales-report-integration.mjs

      - name: Reconcile legacy PR94 schema with real backup and restore (isolated local database)
        working-directory: apps/fra-backend/backend
        env:
          PROVIDER_RECONCILE_TEST_DATABASE: '1'
          NODE_ENV: test
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --input-type=module -e 'import pg from "pg"; const db=new pg.Pool({connectionString:process.env.DATABASE_URL}); try {await db.query("CREATE DATABASE provider_reconcile_test");} finally {await db.end();}'
          cat > /tmp/provider-pg-dump <<'SH'
          #!/usr/bin/env bash
          set -eu
          dest="${!#}"
          docker exec -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD "$POSTGRES_TEST_CONTAINER" pg_dump --format=custom > "$dest"
          SH
          cat > /tmp/provider-pg-restore <<'SH'
          #!/usr/bin/env bash
          set -eu
          source="${!#}"
          docker exec -i -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD "$POSTGRES_TEST_CONTAINER" pg_restore "${@:1:$#-1}" < "$source"
          SH
          chmod 700 /tmp/provider-pg-dump /tmp/provider-pg-restore
          export DATABASE_URL=postgresql://fra:fra-ci-only@localhost:5432/provider_reconcile_test
          export DATABASE_URL_UNPOOLED="$DATABASE_URL"
          PG_DUMP=/tmp/provider-pg-dump PG_RESTORE=/tmp/provider-pg-restore node --import tsx scripts/provider-reconcile-integration.mjs

      - name: Internal electronic signing (PostgreSQL, generated certificate, captured SMTP and S3 double)
        working-directory: apps/fra-backend/backend
        env:
          ESIGN_TEST_DATABASE: '1'
        run: node --import tsx scripts/esign-integration.mjs

      - name: Ensure Chrome for certificate PDF tests
        working-directory: apps/fra-backend/backend
        run: pnpm exec puppeteer browsers install chrome

      - name: Certificate lifecycle and PDFs (PostgreSQL)
        working-directory: apps/fra-backend/backend
        env:
          CERTIFICATE_TEST_DATABASE: '1'
        run: node scripts/certificate-integration.mjs

      - name: Install Chromium for authenticated browser/database checks
        run: pnpm --filter @stopfra/web-dashboard exec playwright install --with-deps chromium

      - name: Electronic signer browser journey (PostgreSQL, captured SMTP and S3 double)
        working-directory: apps/fra-backend/backend
        env:
          ESIGN_TEST_DATABASE: '1'
          ESIGN_BROWSER_TEST: '1'
        run: node --import tsx scripts/esign-integration.mjs

      - name: Authenticated browser journey against PostgreSQL
        env:
          BROWSER_DATABASE_TEST: '1'
        run: pnpm --filter @stopfra/web-dashboard test:e2e:database

      - name: Backend log on failure
        if: failure()
        working-directory: apps/fra-backend/backend
        run: cat backend.log || true

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init (no remote state)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
