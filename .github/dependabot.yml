version: 2
updates:
  # One pnpm lockfile covers every app and package in the workspace
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The three Expo apps are on Expo SDK 54. Each SDK fixes the versions of
      # React Native, React and the Expo packages that work together, so these
      # only move with a deliberate SDK upgrade (`npx expo install --fix`).
      # Patch releases are still offered. Without these rules Dependabot
      # proposed expo-router 58 and react-native 0.88 for an SDK 54 app.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # vitest 5 needs Node 21 or later (Map.groupBy). CI and the server run
      # Node 20. Remove this rule when Node is upgraded.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
